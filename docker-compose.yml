# Local PostgreSQL for development and tests.
# `hearthline` is the development database; `hearthline_test` is created by
# docker/init-test-db.sql and is wiped by the test suite.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hearthline
      POSTGRES_PASSWORD: hearthline
      POSTGRES_DB: hearthline
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hearthline"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
